<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Centinela</title>
  <style>
    :root {
      --bg: #0B1020; --surface: #131A2E; --surface-2: #1A2340; --border: #24304D; --text: #E6EAF2;
      --muted: #9AA6BF; --accent: #22D3EE; --safe: #34D399; --warn: #FBBF24; --danger: #F87171;
      --mono: "Cascadia Code", Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 360px; background: var(--bg); color: var(--text);
           font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    header svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
    header h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--safe); } .dot.off { background: var(--danger); }
    main { padding: 12px 16px 16px; display: grid; gap: 14px; }
    section h2 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .today { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .kpi { padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); text-align: center; }
    .kpi b { display: block; font: 600 18px var(--mono); font-variant-numeric: tabular-nums; }
    .kpi span { font-size: 11px; color: var(--muted); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
    .row + .row { border-top: 1px solid var(--border); }
    .hint { display: block; font-size: 11px; color: var(--muted); }
    .off { opacity: .5; }
    input[type=checkbox] { width: 36px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 3px 0; }
    td:last-child { text-align: right; }
    select, input[type=number], textarea {
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
      font: 12px "Segoe UI", system-ui, sans-serif; padding: 4px 6px;
    }
    select.bloquear { border-color: var(--danger); } select.advertir { border-color: var(--warn); }
    select.permitir { border-color: var(--safe); }
    details { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 6px 10px; }
    details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    textarea { width: 100%; min-height: 84px; resize: vertical; font-family: var(--mono); }
    .small { font-size: 11px; color: var(--muted); }
    .btn { width: 100%; padding: 9px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent);
           color: #04121A; font: 700 13px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 19.6 5v6.1c0 5-3.2 8.9-7.6 10.7C7.6 20 4.4 16.1 4.4 11.1V5Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.6 12.1l2.3 2.3 4.6-4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Centinela</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="backend">Comprobando…</span></div>
  </header>
  <main>
    <section>
      <h2>Hoy</h2>
      <div class="today">
        <div class="kpi"><b id="t-prompts">–</b><span>prompts</span></div>
        <div class="kpi"><b id="t-adv">–</b><span>advertencias</span></div>
        <div class="kpi"><b id="t-cen">–</b><span>censurados</span></div>
        <div class="kpi"><b id="t-blk">–</b><span>bloqueos</span></div>
      </div>
    </section>

    <section>
      <label class="row"><span>Monitoreo<span class="hint">Escudo en vivo, captura y clasificación</span></span>
        <input type="checkbox" id="monitoring"></label>
      <label class="row" id="row-blocking"><span>Aplicar políticas<span class="hint" id="blocking-hint">Bloquear y advertir según cada tipo</span></span>
        <input type="checkbox" id="blocking"></label>
    </section>

    <section>
      <h2>Políticas por tipo</h2>
      <details open>
        <summary>Datos personales y diccionario</summary>
        <table id="pol-pii"></table>
      </details>
      <details>
        <summary>Secretos</summary>
        <table id="pol-secret"></table>
      </details>
    </section>

    <section>
      <h2>Diccionario propio <span class="small" id="dict-count"></span></h2>
      <textarea id="dictionary" spellcheck="false" placeholder="Un término por línea (máx. 50). Ej.: nombre de un proyecto interno"></textarea>
      <span class="small">Sin distinguir mayúsculas ni acentos, palabra completa. Solo se guarda en este navegador; al backend llega el tipo, nunca el término.</span>
    </section>

    <section>
      <label class="row"><span>Aviso de pegado grande<span class="hint">Caracteres a partir de los cuales avisar</span></span>
        <input type="number" id="pasteThreshold" min="200" max="100000" step="100" style="width:90px"></label>
    </section>

    <button class="btn" id="panel" type="button">Abrir centro de control</button>
  </main>
  <script src="patterns.js"></script>
  <script src="popup.js"></script>
</body>
</html>
