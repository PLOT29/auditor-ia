<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Auditor de Prompts</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; width: 280px; padding: 14px 16px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: Canvas; color: CanvasText;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; gap: 12px; }
    .row + .row { border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
    .hint { font-size: 11px; opacity: .65; }
    .status { margin-top: 10px; font-size: 12px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; margin-right: 6px; }
    .dot.ok { background: #16a34a; } .dot.off { background: #dc2626; }
    input[type=checkbox] { width: 34px; height: 18px; accent-color: #2563eb; cursor: pointer; }
    input:disabled { cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>🛡️ Auditor de Prompts</h1>

  <label class="row">
    <span>Monitoreo<br><span class="hint">Captura y clasifica tus prompts</span></span>
    <input type="checkbox" id="monitoring">
  </label>

  <label class="row">
    <span>Modo bloqueo<br><span class="hint">Disponible en Fase 3</span></span>
    <input type="checkbox" id="blocking" disabled>
  </label>

  <div class="status"><span class="dot" id="dot"></span><span id="backend">Comprobando backend…</span></div>

  <script src="popup.js"></script>
</body>
</html>
